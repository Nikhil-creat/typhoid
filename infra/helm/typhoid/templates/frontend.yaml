apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: frontend, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/instance: {{ .Release.Name }} } }
    spec:
      serviceAccountName: {{ .Release.Name }}-frontend
      securityContext: { runAsNonRoot: {{ .Values.podSecurity.runAsNonRoot }}, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: frontend
          image: {{ include "typhoid.image" (dict "root" . "svc" .Values.frontend) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext: { readOnlyRootFilesystem: {{ .Values.podSecurity.readOnlyRootFilesystem }}, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          envFrom: [ { secretRef: { name: {{ .Values.existingSecret }} } } ]
          env:
            {{- include "typhoid.env" . | nindent 12 }}
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts: [ { name: tmp, mountPath: /tmp } ]
      volumes: [ { name: tmp, emptyDir: {} } ]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: {{ .Release.Name }}-frontend }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-frontend }
spec:
  selector: { app.kubernetes.io/name: frontend, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [ { port: 80, targetPort: {{ .Values.frontend.port }} } ]
