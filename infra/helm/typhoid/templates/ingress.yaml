{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations: { nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" }   # long-lived websockets
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls: [ { hosts: [ {{ .Values.global.domain }} ], secretName: {{ .Release.Name }}-tls } ]
  {{- end }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - { path: /api,      pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-backend,  port: { number: 80 } } } }
          - { path: /ws,       pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-backend,  port: { number: 80 } } } }
          - { path: /webhooks, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-backend,  port: { number: 80 } } } }
          - { path: /,         pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-frontend, port: { number: 80 } } } }
{{- end }}
