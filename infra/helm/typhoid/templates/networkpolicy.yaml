{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-default-deny }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Chaos workers: DNS + the target under test only. No cluster-internal access, no metadata endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-worker-egress }
spec:
  podSelector: { matchLabels: { typhoid/role: worker } }
  policyTypes: [Egress]
  egress:
    - to: [ { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } } ]
      ports: [ { port: 53, protocol: UDP } ]
    - to: [ { ipBlock: { cidr: 0.0.0.0/0, except: [169.254.169.254/32, 10.0.0.0/8] } } ]
{{- end }}
