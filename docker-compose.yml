name: typhoid
x-common: &common
  env_file: .env
  restart: unless-stopped
  networks: [typhoid]

services:
  frontend:
    <<: *common
    build: { context: ./frontend, target: runner }
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on: [backend]

  backend:
    <<: *common
    build: { context: ./backend, target: runtime }
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 10s

  agents:
    <<: *common
    build: { context: ., dockerfile: agents/Dockerfile, target: runtime }
    deploy: { replicas: 2 }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]   # dev only: use k8s runtime in prod
    depends_on: [backend, qdrant, neo4j, redis]

  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: typhoid, POSTGRES_PASSWORD: typhoid, POSTGRES_DB: typhoid }
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U typhoid"], interval: 5s }
    networks: [typhoid]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    networks: [typhoid]

  kafka:
    image: bitnami/kafka:3.7
    profiles: [kafka]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    networks: [typhoid]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrant:/qdrant/storage]
    networks: [typhoid]

  neo4j:
    image: neo4j:5.24
    environment: { NEO4J_AUTH: neo4j/typhoid-neo4j }
    volumes: [neo4j:/data]
    networks: [typhoid]

  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    environment: { VAULT_DEV_ROOT_TOKEN_ID: dev-only-token }
    networks: [typhoid]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel.yaml"]
    volumes: ["./infra/observability/otel.yaml:/etc/otel.yaml:ro"]
    networks: [typhoid]

  # Demo target app the swarm can test out-of-the-box
  demo-target:
    image: ghcr.io/stefanprodan/podinfo:6.7.1
    networks: [typhoid]

volumes: { pg: {}, redis: {}, qdrant: {}, neo4j: {} }
networks: { typhoid: { driver: bridge } }
